<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#2a2228;display:flex;flex-wrap:wrap;gap:16px;padding:16px}img{background:radial-gradient(#6b6058,#3a3230);border-radius:12px;padding:8px}</style></head>
<body><script type="module">
import * as A from '../src/art/index.ts';
for (const [name, s] of Object.entries(A.SHEET)) {
  const img = new Image(); img.title = name;
  img.src = URL.createObjectURL(new Blob([s()], {type:'image/svg+xml'}));
  img.onload = () => { img.height = 2 * img.naturalHeight; };
  document.body.appendChild(img);
}
</script></body></html>
